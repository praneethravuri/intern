version: 2

# CGO_ENABLED=0 and -trimpath match `make build`/`make cross` exactly (Makefile).
# main.version gets the "v" prefix back so a release binary and a `git describe`
# local build report the same shape.
builds:
  - id: tether
    main: ./cmd/tether
    binary: tether
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: -s -w -X main.version=v{{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # Byte-identical output for the same commit regardless of when/where it's built.
    mod_timestamp: '{{ .CommitTimestamp }}'

# One archive per platform. Name has no version in it, so install.sh can use
# the stable /releases/latest/download/ and /releases/download/<tag>/ URLs
# with no GitHub API call.
archives:
  - id: tether
    name_template: "tether_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# Keyless cosign signature over checksums.txt covers every artifact by its
# hash, so signing each archive individually would be redundant.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    artifacts: checksum

sboms:
  - artifacts: archive

# Homebrew tap: praneethravuri/homebrew-tap does not exist yet, and a
# release would fail outright trying to push a formula to a missing repo.
