name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Catches newly disclosed CVEs against pinned dependencies even with no new commits.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # No CodeQL job here: GitHub's default setup is already configured for
  # this repo (code-scanning/default-setup, languages go+actions, weekly)
  # and a workflow-based analysis cannot run alongside it -- GitHub rejects
  # the second SARIF upload outright. Adding one here would just be a
  # guaranteed-failing duplicate of coverage that already exists.
