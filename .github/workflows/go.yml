name: Go CI

on:
  push:
    branches: [ main, feat/*, feat/**, fix/* ]
  pull_request:
    branches: [ main ]

# Nothing here writes to the repository or publishes anything.
permissions:
  contents: read

# A new push to the same ref makes the in-flight run pointless: cancel it.
concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Generic file hygiene: trailing whitespace, final newlines, YAML validity,
  # large files. The two Go hooks are skipped because dedicated jobs below run
  # gofmt and golangci-lint with better caching and PR annotations; the hooks
  # still exist so the same checks gate local commits.
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: golangci-lint,go-fmt

  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # go-version-file keeps the toolchain in one place: bump go.mod and CI
      # follows. cache: true caches the module cache and the build cache,
      # keyed on go.sum.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The e2e suite drives a unix-socket daemon, so it is POSIX-only. Rather
      # than fail the Windows leg, drop that package from the list there; every
      # other package is expected to build and test on all three platforms.
      - name: Select packages
        id: pkgs
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            list=$(go list ./... | grep -v '/e2e' | tr '\n' ' ')
          else
            list=$(go list ./... | tr '\n' ' ')
          fi
          echo "list=${list}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: go build ${{ steps.pkgs.outputs.list }}

      - name: Vet
        shell: bash
        run: go vet ${{ steps.pkgs.outputs.list }}

      # Linux only: a Windows checkout may normalise line endings, which makes
      # gofmt report every file. One authoritative formatting check is enough.
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            echo
            echo "Run 'make fmt' and commit the result."
            exit 1
          fi

      - name: Test
        shell: bash
        run: go test -race -count=1 ${{ steps.pkgs.outputs.list }}

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The action reads .golangci.yml from the repo root; do not duplicate the
      # linter list here.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Proves the release story: pure-Go SQLite means both binaries build for
      # every target from one host with no C toolchain in sight.
      - name: Build both binaries
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/tether  ./cmd/tether
          go build -trimpath -ldflags "-s -w" -o /tmp/tetherd ./cmd/tetherd
