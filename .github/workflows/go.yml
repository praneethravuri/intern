name: Go CI

on:
  push:
    branches: [ main, feat/*, feat/**, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Set up the official Go environment (needed for our system Go hooks)
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: true

      # 3. Run the official pre-commit GitHub Action
      # This automatically detects and runs hooks in '.pre-commit-config.yaml'.
      # golangci-lint is skipped here and handled by the dedicated action below,
      # which caches the binary and annotates the diff. The hook still exists so
      # the same linter gates local commits.
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: golangci-lint

      # 4. Actually compile and test. Neither ran in CI before this, so a broken
      # build or a failing test could merge silently.
      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

      # 5. .golangci.yml configured 8 linters that nothing ever invoked.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
