name: Go CI

on:
  push:
    branches: [ main, feat/*, feat/**, fix/* ]
  pull_request:
    branches: [ main ]

# Nothing here writes to the repository or publishes anything.
permissions:
  contents: read

# A new push to the same ref makes the in-flight run pointless: cancel it.
concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go hooks skipped: dedicated jobs below run gofmt/golangci-lint with better caching.
  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: golangci-lint,go-fmt

  build-and-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      # One platform failing should not hide the result on the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # e2e is POSIX-only, dropped on Windows. It also has no non-test Go
      # files, so `go build <pkg>` fails on it unlike wildcard `go build ./...`
      # -- buildlist drops it everywhere, on top of the platform filter.
      - name: Select packages
        id: pkgs
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            list=$(go list ./... | grep -v '/e2e' | tr '\n' ' ')
          else
            list=$(go list ./... | tr '\n' ' ')
          fi
          buildlist=$(echo "$list" | tr ' ' '\n' | grep -v '/e2e$' | tr '\n' ' ')
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "buildlist=${buildlist}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: go build ${{ steps.pkgs.outputs.buildlist }}

      - name: Vet
        shell: bash
        run: go vet ${{ steps.pkgs.outputs.list }}

      # Linux only: a Windows checkout normalises line endings, which would make
      # gofmt report every file.
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            echo
            echo "Run 'make fmt' and commit the result."
            exit 1
          fi

      - name: Test
        shell: bash
        run: go test -race -count=1 ${{ steps.pkgs.outputs.list }}

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Reads .golangci.yml from the repo root; don't duplicate the linter list here.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  shellcheck:
    # Nothing else catches a syntax error in a script users pipe into `sh`.
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: docs

  cross-compile:
    name: cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Proves pure-Go SQLite builds both binaries for every target with no C toolchain.
      - name: Build both binaries
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/tether  ./cmd/tether
          go build -trimpath -ldflags "-s -w" -o /tmp/tetherd ./cmd/tetherd
