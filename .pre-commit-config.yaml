# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Run Go format & vet locally using the system's Go installation
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt -s -w
        language: system
        types: [go]
        pass_filenames: true

      # Replaces standalone `go vet`: govet is one of .golangci.yml's linters.
      # CI skips this hook and runs golangci-lint via the dedicated action instead.
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false
